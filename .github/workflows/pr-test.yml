name: PR Test

on:
  push:
    branches:
      - refactor/knowledge-map-search-v2
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild index
        run: python index.py

      - name: Run evaluation
        run: python evaluate.py
